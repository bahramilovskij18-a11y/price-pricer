<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет устройств</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://web.telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <!-- История слева -->
        <div class="history-panel">
            <div class="history-header">История</div>
            <div class="history-list" id="historyList">
                <div class="empty-state">
                    <div class="empty-icon">📊</div>
                    <div class="empty-text">Нет записей</div>
                </div>
            </div>
        </div>

        <!-- Форма справа -->
        <div class="form-panel">
            <div class="form-header">Новая запись</div>

            <form id="recordForm" class="form-content">
                <!-- Выбор группы -->
                <div class="form-group">
                    <label class="form-label">Группа</label>
                    <select id="groupSelect" class="form-select" required>
                        <option value="">Выберите группу</option>
                        <option value="Tiger">Tiger</option>
                        <option value="Parnasa">Parnasa</option>
                        <option value="DM">DM</option>
                        <option value="ПРАЙС">ПРАЙС</option>
                        <option value="2PAC">2PAC</option>
                        <option value="ПРОСТОР">ПРОСТОР</option>
                    </select>
                </div>

                <!-- Название устройства -->
                <div class="form-group">
                    <label class="form-label">Устройство</label>
                    <input type="text" id="deviceName" class="form-input" placeholder="Название устройства" required>
                </div>

                <!-- Покупка и продажа -->
                <div class="price-section">
                    <div class="price-group">
                        <label class="price-label">Покупка</label>
                        <div class="price-input-wrapper">
                            <span class="currency">₽</span>
                            <input type="number" id="buyPrice" class="price-input" placeholder="0" step="0.01">
                        </div>
                    </div>
                    <div class="price-divider"></div>
                    <div class="price-group">
                        <label class="price-label">Продажа</label>
                        <div class="price-input-wrapper">
                            <span class="currency">₽</span>
                            <input type="number" id="sellPrice" class="price-input" placeholder="0" step="0.01">
                        </div>
                    </div>
                </div>

                <!-- Кнопка отправки -->
                <button type="submit" class="submit-btn">Добавить запись</button>
            </form>
        </div>
    </div>

    <!-- Toast уведомление -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
