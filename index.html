<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Учет устройств</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://web.telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.plot.ly/plotly-basic-2.27.0.min.js"></script>
</head>
<body>

    <!-- Экран: История -->
    <div class="screen screen-history active" id="screenHistory">
        <div class="screen-header">
            <span class="screen-title">История</span>
            <div class="header-actions">
                <button class="icon-btn" id="searchToggleBtn" onclick="toggleSearch()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                </button>
                <button class="stats-btn" onclick="openStats()">Статистика</button>
            </div>
        </div>
        <div class="search-bar hidden" id="searchBar">
            <input type="search" id="searchInput" class="search-input"
                   placeholder="Устройство или продавец..."
                   oninput="filterHistory()"
                   autocomplete="off">
        </div>
        <div class="history-list" id="historyList">
            <div class="empty-state">
                <div class="empty-icon">📊</div>
                <div class="empty-text">Нет записей</div>
            </div>
        </div>
    </div>

    <!-- Экран: Новая запись -->
    <div class="screen screen-form" id="screenForm">
        <div class="screen-header">
            <span class="screen-title">Новая запись</span>
        </div>
        <form id="recordForm" class="form-content">

            <div class="form-group">
                <label class="form-label">Продавец / Группа</label>
                <select id="groupSelect" class="form-select" required>
                    <option value="">Выберите группу</option>
                    <option value="Всего поМногу">Всего поМногу</option>
                    <option value="THLS">THLS</option>
                    <option value="Go_Price">Go_Price</option>
                    <option value="Parnasa">Parnasa</option>
                    <option value="Quantum">Quantum</option>
                    <option value="Global">Global</option>
                    <option value="ПРАЙС">ПРАЙС</option>
                    <option value="Apple Gid">Apple Gid</option>
                    <option value="DM">DM</option>
                    <option value="Brooklyn">Brooklyn</option>
                    <option value="2Pac">2Pac</option>
                    <option value="Конвент">Конвент</option>
                    <option value="ПроСтор">ПроСтор</option>
                    <option value="Женек">Женек</option>
                    <option value="Другой">Другой...</option>
                </select>
            </div>

            <div class="form-group" id="customSellerGroup" style="display:none">
                <label class="form-label">Имя продавца</label>
                <input type="text" id="customSellerName" class="form-input" placeholder="Введите имя продавца">
            </div>

            <div class="form-group">
                <label class="form-label">Устройство</label>
                <input type="text" id="deviceName" class="form-input" placeholder="Название устройства" required>
            </div>

            <div class="form-group">
                <label class="form-label">Количество</label>
                <input type="number" id="quantity" class="form-input" value="1" min="1" step="1">
            </div>

            <div class="price-section">
                <div class="price-group">
                    <label class="price-label">Покупка</label>
                    <div class="price-input-wrapper">
                        <span class="currency">₽</span>
                        <input type="number" id="buyPrice" class="price-input" placeholder="0" step="0.01" min="0">
                    </div>
                </div>
                <div class="price-divider"></div>
                <div class="price-group">
                    <label class="price-label">Продажа</label>
                    <div class="price-input-wrapper">
                        <span class="currency">₽</span>
                        <input type="number" id="sellPrice" class="price-input" placeholder="0" step="0.01" min="0">
                    </div>
                </div>
            </div>

            <div class="totals-display" id="totalsDisplay" style="display:none">
                <div class="total-item" id="totalBuy"></div>
                <div class="total-item total-sell" id="totalSell"></div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Кто купил
                    <span class="optional-label">необязательно</span>
                </label>
                <input type="text" id="buyerName" class="form-input" placeholder="Имя покупателя">
            </div>

            <button type="submit" class="submit-btn">Добавить запись</button>

        </form>
    </div>

    <!-- Нижняя навигация -->
    <nav class="tab-bar">
        <button class="tab tab-history active" onclick="switchTab('history')">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            <span class="tab-label">История</span>
        </button>
        <button class="tab tab-form" onclick="switchTab('form')">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <span class="tab-label">Добавить</span>
        </button>
    </nav>

    <!-- Модал Статистики -->
    <div id="statsModal" class="stats-modal hidden">
        <div class="stats-modal-content">

            <div class="stats-header">
                <button class="back-btn" onclick="closeStats()">← Назад</button>
                <span class="stats-title">Статистика</span>
                <div class="stats-header-gap"></div>
            </div>

            <div class="period-tabs">
                <button class="period-tab active" data-period="day" onclick="loadStats('day')">Сегодня</button>
                <button class="period-tab" data-period="week" onclick="loadStats('week')">Неделя</button>
                <button class="period-tab" data-period="month" onclick="loadStats('month')">Месяц</button>
                <button class="period-tab" data-period="all" onclick="loadStats('all')">Всё время</button>
            </div>

            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-card-label">Прибыль</div>
                    <div class="stat-card-value positive" id="statProfit">₽0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Покупки</div>
                    <div class="stat-card-value" id="statBuys">₽0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Продажи</div>
                    <div class="stat-card-value" id="statSells">₽0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Сделки</div>
                    <div class="stat-card-value" id="statDeals">0 шт.</div>
                </div>
            </div>

            <div class="stats-section">
                <div class="section-title">Прибыль по дням</div>
                <div id="statsChartContainer" class="chart-container"></div>
            </div>

            <div class="stats-section">
                <div class="section-title">История по продавцу</div>
                <select id="sellerStatsSelect" class="form-select" onchange="loadSellerStats()">
                    <option value="">Выберите продавца</option>
                </select>
                <div id="sellerHistoryContainer" class="seller-history-container"></div>
            </div>

            <div class="stats-section">
                <div class="section-title">Касса</div>
                <div class="cash-info-line" id="cashInitial">Начальный капитал: ₽0</div>
                <div class="cash-info-line" id="cashProfitLine">Прибыль от сделок: ₽0</div>
                <div class="cash-balance-row">
                    <span class="cash-balance-label">Итого баланс:</span>
                    <span class="cash-balance-value positive" id="cashBalance">₽0</span>
                </div>
                <button class="cash-init-btn" onclick="handleInitCash()">Установить начальный баланс</button>
            </div>

        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Модал ввода суммы кассы -->
    <div id="cashInputModal" class="cash-input-modal hidden">
        <div class="cash-input-overlay" onclick="closeCashInput()"></div>
        <div class="cash-input-dialog">
            <div class="cash-input-title">Начальный баланс кассы</div>
            <input type="number" id="cashInputField" class="cash-input-field" placeholder="0" min="0" step="1">
            <div class="cash-input-actions">
                <button class="cash-input-cancel" onclick="closeCashInput()">Отмена</button>
                <button class="cash-input-confirm" onclick="confirmCashInput()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
